[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-validator"
version = "0.12.0"
description = "Enterprise cross-database validation & diff engine for SIT data reconciliation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Datafold", email = "data-diff@datafold.com" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "click>=8.1",
    "dsnparse<0.2.0",
    "toml>=0.10.2",
    "tabulate>=0.9.0",
    "attrs>=23.1.0",
    "typing-extensions>=4.0.1",
    "requests>=2.28.0",
    "duckdb>=0.9.0",
    "tzdata>=2023.3",
]

[project.optional-dependencies]
athena = [
    "pyathena>=3.0.0",
    "boto3>=1.28.0",
]
maxcompute = [
    "pyodps>=0.11.0",
]
mssql = [
    "pyodbc>=4.0.39",
]
postgres = [
    "psycopg2-binary>=2.9.0",
]
snowflake = [
    "snowflake-connector-python>=3.0.2,<4.0.0",
    "cryptography",
]
trino = [
    "trino>=0.314.0",
]
presto = [
    "presto-python-client>=0.8.3",
]
clickhouse = [
    "clickhouse-driver>=0.2.0",
]
oracle = [
    "oracledb>=1.0.0",
]
vertica = [
    "vertica-python>=1.0.0",
]
mysql = [
    "mysql-connector-python>=8.0.29",
]
ui = [
    "streamlit>=1.30.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.4",
    "mypy>=1.0.0",
    "parameterized>=0.9.0",
    "tzdata>=2023.3",
]

[project.scripts]
data-diff = "data_diff.__main__:main"
data-validator = "validator.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_diff*", "validator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line length
    "E711",  # Comparison to None
    "E712",  # Comparison to boolean
    "E722",  # Bare except
    "E741",  # Ambiguous variable name
    "F401",  # Imported but unused
    "F403",  # Star imports
    "F405",  # Star import usage
    "F811",  # Redefinition of unused name
    "F841",  # Unused variable
    "W291",  # Trailing whitespace in multiline test fixtures
    "W293",  # Blank line contains whitespace
]

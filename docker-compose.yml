version: "3.8"

services:
  # Simulated Source Database (PostgreSQL 16)
  source_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: validator_user
      POSTGRES_PASSWORD: validator_password
      POSTGRES_DB: source_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validator_user -d source_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Simulated Target Database (PostgreSQL 16)
  target_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: validator_user
      POSTGRES_PASSWORD: validator_password
      POSTGRES_DB: target_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validator_user -d target_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Data Validator Container
  data_validator:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      source_db:
        condition: service_healthy
      target_db:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro
      - ./reports:/app/reports
    environment:
      - AWS_REGION=us-east-1
      - ATHENA_S3_STAGING=s3://simulated-bucket/staging/
      - ODPS_ENDPOINT=https://service.odps.aliyun.com/api
      - ODPS_PROJECT=simulated_sit_project
      - ODPS_ACCESS_ID=simulated_access_id
      - ODPS_ACCESS_KEY=simulated_access_key
    entrypoint: ["data-validator"]
    command: ["validate-config", "--config", "/app/configs/sit_manifest.example.yaml"]
